# Theme check config: only real breakages fail the deploy
extends: theme-check:recommended

# ── Files owned by page-builder apps (GemPages, Zipify, PageFly) ──
ignore:
  - layout/*gempages*
  - layout/*zipifypages*
  - layout/*pagefly*
  - sections/*gempages*
  - sections/*zipifypages*
  - sections/*pagefly*
  - snippets/*gempages*
  - snippets/*zipifypages*
  - snippets/*pagefly*
  - templates/*gempages*
  - templates/*zipifypages*
  - templates/*pagefly*

# ── Existing errors in the legacy theme / app code ──
MatchingTranslations:
  enabled: false
TranslationKeyExists:
  enabled: false
UndefinedObject:
  enabled: false
MissingTemplate:
  enabled: false
MissingAsset:
  enabled: false
ValidHTMLTranslation:
  enabled: false

# ── Performance / style warnings (noise for now) ──
RemoteAsset:
  enabled: false
AssetPreload:
  enabled: false
CdnPreconnect:
  enabled: false
ParserBlockingScript:
  enabled: false
ImgWidthAndHeight:
  enabled: false
AssetSizeCSS:
  enabled: false
AssetSizeJavaScript:
  enabled: false
AssetSizeAppBlockCSS:
  enabled: false
AssetSizeAppBlockJavaScript:
  enabled: false
DeprecateBgsizes:
  enabled: false
DeprecateLazysizes:
  enabled: false
DeprecatedFilter:
  enabled: false
DeprecatedTag:
  enabled: false
VariableName:
  enabled: false
UnclosedHTMLElement:
  enabled: false
UnusedAssign:
  enabled: false
ContentForHeaderModification:
  enabled: false
HardcodedRoutes:
  enabled: false