name: Sync from live store
on:
  schedule:
    - cron: "0 * * * *"   # hourly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: theme-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: prod        # remove if you use repository secrets
    env:
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @shopify/cli@3

      - name: Pull everything from live theme
        run: shopify theme pull --live --nodelete

      - name: Open PR with store changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: store-sync
          base: main
          commit-message: "[store-sync] Changes from live store"
          title: "Store sync: changes from live store"
          body: "Automated sync from the live theme: theme editor settings, app-generated files, and any code edited in the admin."
          delete-branch: true