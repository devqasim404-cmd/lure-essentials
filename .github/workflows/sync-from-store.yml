name: Sync from live store
on:
  schedule:
    - cron: "0 * * * *"   # hourly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: theme-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: prod
    env:
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @shopify/cli@3

      - name: Pull theme editor changes
        run: |
          shopify theme pull --live --nodelete \
            --only "config/settings_data.json" \
            --only "templates/*.json" \
            --only "templates/customers/*.json" \
            --only "sections/*.json"

      - name: Open PR with store changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: store-sync
          base: main
          commit-message: "[store-sync] Theme editor changes from live store"
          title: "Store sync: theme editor changes"
          body: "Automated sync of theme editor changes (settings_data.json, templates, sections JSON) from the live store."
          delete-branch: true